services:
  mongo:
    image: mongo:7
    container_name: gdpr-analyzer-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: gdpr_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in your environment}
      MONGO_INITDB_DATABASE: gdpr_analyzer
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - gdpr_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gdpr_mongo_data:
